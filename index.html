const matchCity = city === “All” || p.city === city;
const matchSearch = p.title.toLowerCase().includes(search.toLowerCase()) ||
p.location.toLowerCase().includes(search.toLowerCase()) ||
p.city.toLowerCase().includes(search.toLowerCase());
return matchTab && matchCity && matchSearch;
});

const AI_STEPS = [“Scanning exterior walls…”,“Analysing roof condition…”,“Checking drainage…”,“Inspecting windows…”,“Running valuation model…”,“Generating report…”];

const startAI = () => {
setAiState(“scanning”); setAiPct(0); setAiStep(0);
let s = 0;
const tick = setInterval(() => {
s++;
setAiStep(s);
setAiPct(Math.round((s/AI_STEPS.length)*100));
if(s >= AI_STEPS.length){ clearInterval(tick); setTimeout(()=>setAiState(“done”),600); }
}, 900);
};

const sendChat = async () => {
if(!chatMsg.trim() || chatLoading) return;
const msg = chatMsg.trim();
setChatMsg(””);
setChatHistory(h=>[…h,{from:“user”,text:msg}]);
setChatLoading(true);
try {
const res = await fetch(“https://api.anthropic.com/v1/messages”,{
method:“POST”,
headers:{“Content-Type”:“application/json”},
body:JSON.stringify({
model:“claude-sonnet-4-20250514”,max_tokens:200,
system:“You are Emeka, a Nigerian real estate agent for Naijaest.com covering Lagos and Abuja. Be friendly, brief (2 sentences max), and use natural Nigerian context.”,
messages:[{role:“user”,content:msg}]
})
});
const data = await res.json();
setChatHistory(h=>[…h,{from:“agent”,text:data.content?.[0]?.text||“Please call me directly!”}]);
} catch {
setChatHistory(h=>[…h,{from:“agent”,text:“Network issue - WhatsApp me directly!”}]);
}
setChatLoading(false);
};
